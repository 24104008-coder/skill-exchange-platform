{% extends "base.html" %}

{% block title %}Sign In - Student Skill Sharing{% endblock %}

{% block content %}
<div class="container container-sm">
  <div class="card" style="margin-top: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">🔑</div>
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to your SkillExchange account</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">College Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn" style="margin-top: 1rem;">
        Sign In &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register now</a>
    </div>
  </div>
</div>
{% endblock %}
