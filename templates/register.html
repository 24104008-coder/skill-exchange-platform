{% extends "base.html" %}

{% block title %}Register - Student Skill Sharing{% endblock %}

{% block content %}
<div class="container container-sm">
  <div class="card" style="margin-top: 1rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">🎓</div>
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Create Student Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Join your campus skill sharing network</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Chen" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">College Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@college.edu" required>
        <div class="form-help">Must be a valid and unique email address.</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password *</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
        <div class="form-help">Minimum 6 characters.</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="department" class="form-label">Department *</label>
          <select id="department" name="department" class="form-control" required>
            <option value="" disabled selected>Select Department</option>
            {% for dept in departments %}
              <option value="{{ dept }}">{{ dept }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="year" class="form-label">Current Year *</label>
          <select id="year" name="year" class="form-control" required>
            <option value="" disabled selected>Select Year</option>
            {% for yr in years %}
              <option value="{{ yr }}">{{ yr }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="bio" class="form-label">Short Bio / Interests (Optional)</label>
        <textarea id="bio" name="bio" class="form-control" rows="3" placeholder="Tell other students what you're interested in learning or teaching..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-submit-btn" style="margin-top: 1rem;">
        Complete Registration &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In here</a>
    </div>
  </div>
</div>
{% endblock %}
